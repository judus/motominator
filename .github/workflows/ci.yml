name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: PR route
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate integration route
        env:
          PR_BASE: ${{ github.base_ref }}
          PR_HEAD: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$PR_BASE" == main ]]; then
            if [[ "$PR_HEAD" != dev || "$HEAD_REPOSITORY" != "$REPOSITORY" ]]; then
              echo '::error::Only the repository dev branch may target main.'
              exit 1
            fi
          elif [[ "$PR_BASE" == dev ]]; then
            if [[ ! "$PR_HEAD" =~ ^(feature|fix|chore|refactor|docs|test|ci)/[a-z0-9][a-z0-9._/-]*$ ]]; then
              echo '::error::Target dev from feature/, fix/, chore/, refactor/, docs/, test/ or ci/ branches.'
              exit 1
            fi
          else
            echo '::error::Unsupported integration target.'
            exit 1
          fi

  server:
    name: Laravel / MySQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/server
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: sail
      DB_PASSWORD: password
      REDIS_HOST: 127.0.0.1
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
          MYSQL_USER: sail
          MYSQL_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, intl, bcmath, pdo_mysql, pdo_sqlite, redis, pcntl, posix
          coverage: none
          tools: composer:v2
      - name: Validate Composer manifest and lockfile
        run: composer validate --strict
      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Audit PHP dependencies
        run: composer audit --no-interaction
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
      - name: Validate Sail configuration
        run: docker compose config --quiet
        env:
          WWWUSER: "1001"
          WWWGROUP: "1001"
      - name: Check PHP formatting
        run: composer format:check
      - name: Analyse PHP with Larastan
        run: composer analyse
      - name: Run MySQL migrations
        run: php artisan migrate --force --no-interaction
      - name: Run server tests
        run: php artisan test --compact
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install browser test dependencies
        working-directory: .
        run: npm ci
      - name: Install Chromium
        working-directory: .
        run: npx playwright install --with-deps chromium
      - name: Test browser cookie authentication
        working-directory: .
        run: npm run test:e2e --workspace=@motominator/web
        env:
          E2E_SERVER_COMMAND: cd ../server && php artisan serve --host=127.0.0.1 --port=8001 --no-reload
          APP_ENV: e2e
          APP_URL: http://localhost:8001
          FRONTEND_URL: http://localhost:5179
          CORS_ALLOWED_ORIGINS: http://localhost:5179
          SANCTUM_STATEFUL_DOMAINS: localhost:5179
          AUTH_REGISTRATION_ENABLED: "true"
          MAIL_MAILER: array

  clients:
    name: Browser / Expo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install npm 11
        run: npm install --global npm@11.9.0
      - name: Install workspace dependencies
        run: npm ci
      - name: Lint clients
        run: npm run lint
      - name: Typecheck clients
        run: npm run typecheck
      - name: Check client formatting
        run: npm run format:check
      - name: Test browser and mobile apps
        run: npm test
      - name: Build browser app
        run: npm run build:web
      - name: Build Laravel starter assets
        run: npm run build:server
      - name: Export Android, iOS and Expo web bundles
        run: npm run build:mobile

  quality:
    name: Quality gate
    if: always()
    needs: [policy, server, clients]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all gates to succeed
        env:
          EVENT_NAME: ${{ github.event_name }}
          POLICY_RESULT: ${{ needs.policy.result }}
          SERVER_RESULT: ${{ needs.server.result }}
          CLIENTS_RESULT: ${{ needs.clients.result }}
        run: |
          [[ "$SERVER_RESULT" == success && "$CLIENTS_RESULT" == success ]] || exit 1
          if [[ "$EVENT_NAME" == pull_request ]]; then
            [[ "$POLICY_RESULT" == success ]] || exit 1
          fi
